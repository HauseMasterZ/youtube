<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Music</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="YT Player">
    <link rel="stylesheet" href="css/style.css?v=13">
</head>
<body>

<div class="main-layout">
    <div id="lyrics-container">
        <!-- Close button always visible when lyrics are open -->
        <button id="btn-close-lyrics">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <div id="lyrics-content">
            <p class="lyrics-placeholder">Select a track to view lyrics.</p>
        </div>
    </div>

    <div class="player-container">
    <div class="header">
        <select id="playlist-select">
            <option value="Gym">Gym</option>
            <option value="Driving">Driving</option>
            <option value="Songs">Songs</option>
            <option value="INSTALL_APP">Install App...</option>
        </select>
        <input type="text" id="search-input" placeholder="Search tracks..." autocomplete="off" autofocus>
    </div>

    <div class="now-playing" id="now-playing">
        <button class="btn-collapse" id="btn-collapse" style="display: none;">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
        </button>
        <div id="album-art-container">
            <img id="album-art-image" src="" alt="Album Art" decoding="async" fetchpriority="low">
            <div id="thumb-toggle-hint"><svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>Show thumbnails</div>
        </div>
        <div class="title-channel-wrapper" id="title-channel-wrapper">
            <h2 id="current-title">Select a track</h2>
            <p id="current-channel">--</p>
        </div>
        <div id="lyrics-toggle-hint"><svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 12H5v-2h14v2zm0-4H5V9h14v2z"/></svg>Show lyrics</div>
        <div id="media-session-controls" style="display: none;"></div>
        <!-- Dual audio elements for gapless playback without creating unblessed nodes -->
        <audio id="audio-player-1" preload="auto"></audio>
        <audio id="audio-player-2" preload="auto"></audio>

        <div class="progress-container">
            <span id="current-time" class="time-display">0:00</span>
            <input type="range" id="seek-bar" min="0" value="0" step="1">
            <span id="total-time" class="time-display">0:00</span>
        </div>
        
        <div class="playback-controls">
            <button id="btn-shuffle" class="control-btn" aria-label="Shuffle">
                <svg id="icon-shuffle" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                <svg id="icon-shuffle-one" viewBox="0 0 24 24" style="display: none;">
                    <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
                    <text x="3" y="15" font-size="10" font-weight="500" fill="currentColor" font-family="sans-serif" text-anchor="middle" stroke="#000000" stroke-width="3" paint-order="stroke fill">1</text>
                </svg>
            </button>
            
            <button id="btn-prev" class="control-btn" aria-label="Previous">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            
            <button id="btn-play-pause" class="control-btn main-btn" aria-label="Play/Pause">
                <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="icon-pause" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            
            <button id="btn-next" class="control-btn" aria-label="Next">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
            
            <button id="btn-repeat" class="control-btn" aria-label="Repeat">
                <svg id="icon-repeat" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                <svg id="icon-repeat-one" viewBox="0 0 24 24" style="display: none;">
                    <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
                    <text x="12" y="16" font-size="11" font-weight="600" fill="currentColor" font-family="sans-serif" text-anchor="middle" stroke="#000000" stroke-width="3" paint-order="stroke fill">1</text>
                </svg>
            </button>
        </div>
    </div>

    <div class="playlist-container" id="playlist-container">
        <div id="playlist-message">Loading...</div>
        <ul id="track-list">
        </ul>
    </div>
</div>

<div id="version-display" style="position:fixed; top:5px; left:5px; font-size:12px; color:white; z-index:9999; text-shadow: 1px 1px 2px black;">v14.30</div>

<script src="js/dom.js?v=14.30"></script>
<script src="js/utils.js?v=14.30"></script>
<script src="js/state.js?v=14.30"></script>
<script src="js/ui.js?v=14.30"></script>
<script src="js/mediaSession.js?v=14.30"></script>
<script src="js/lyrics.js?v=14.30"></script>
<script src="js/playback.js?v=14.30"></script>
<script src="js/main.js?v=14.30"></script>
</body>
