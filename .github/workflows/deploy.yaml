name: Production Edge & GitHub Pages Deployment

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "production-deployments-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build & Minify Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: site-root

      - name: Pre-Deployment Syntax & Integrity Guard
        run: |
          echo "==> Running syntax verification on source JavaScript files..."
          for f in site-root/js/*.js site-root/sw.js; do
            if [ -f "$f" ]; then
              node --check "$f"
            fi
          done
          echo "All source scripts passed syntax verification."

      - name: Inject API Gateway URL
        env:
          GATEWAY_URL: ${{ secrets.FEED_GATEWAY_URL || vars.FEED_GATEWAY_URL }}
        run: |
          if [ -n "$GATEWAY_URL" ]; then
            if [ -f site-root/index.html ]; then
              sed -i "s|__API_GATEWAY_URL__|$GATEWAY_URL|g" site-root/index.html
            fi
            if [ -f site-root/js/utils.js ]; then
              sed -i "s|__API_GATEWAY_URL__|$GATEWAY_URL|g" site-root/js/utils.js
            fi
          else
            if [ -f site-root/index.html ]; then
              sed -i '/__API_GATEWAY_URL__/d' site-root/index.html
            fi
          fi

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: false

      - name: Cache npm global tools
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-tools-v2
          restore-keys: |
            ${{ runner.os }}-npm-tools-

      - name: Install Build Tools
        run: npm install -g --prefer-offline html-minifier-terser terser clean-css-cli

      - name: Build, Bundle, and Minify Source Files
        env:
          BUILD_VER: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          const buildVer = (process.env.BUILD_VER || Date.now().toString()).substring(0, 10);
          const branch = process.env.BRANCH_NAME || 'dev';

          function buildDirectory(dir) {
            if (!fs.existsSync(dir)) return;
            console.log(`==> Building, bundling, and minifying ${dir} (Build: ${buildVer})...`);

            // 1. Bundle 8 JS modules into single bundle.min.js
            const jsOrder = ['state.js', 'dom.js', 'utils.js', 'ui.js', 'mediaSession.js', 'lyrics.js', 'playback.js', 'main.js'];
            const jsDir = path.join(dir, 'js');
            let combinedJs = '';
            jsOrder.forEach(file => {
              const fPath = path.join(jsDir, file);
              if (fs.existsSync(fPath)) {
                combinedJs += '\n;\n' + fs.readFileSync(fPath, 'utf8');
              }
            });

            const bundlePath = path.join(jsDir, 'bundle.min.js');
            const tempBundle = path.join(jsDir, 'bundle.tmp.js');
            fs.writeFileSync(tempBundle, combinedJs, 'utf8');
            execSync(`terser --compress passes=3,pure_getters=true,unsafe=true --mangle --comments false -o "${bundlePath}" "${tempBundle}"`);
            if (fs.existsSync(tempBundle)) fs.unlinkSync(tempBundle);

            // 2. Minify CSS
            const cssPath = path.join(dir, 'css', 'style.css');
            let minifiedCss = '';
            if (fs.existsSync(cssPath)) {
              execSync(`cleancss -O2 -o "${cssPath}" "${cssPath}"`);
              minifiedCss = fs.readFileSync(cssPath, 'utf8');
            }

            // 3. Update, inline Critical CSS, and minify index.html
            const indexPath = path.join(dir, 'index.html');
            if (fs.existsSync(indexPath)) {
              let html = fs.readFileSync(indexPath, 'utf8');
              if (minifiedCss) {
                const inlinedCss = minifiedCss.replace(/url\((['"]?)\.\.\//g, 'url($1');
                html = html.replace(/<link\s+rel="stylesheet"\s+href="css\/style\.css(\?v=[^"]*)?">/i, `<style>${inlinedCss}</style>`);
              }
              html = html.replace(/<script\s+src="js\/(dom|utils|state|ui|mediaSession|lyrics|playback|main)\.js(\?v=[^"]*)?"><\/script>(\s*)/g, '');
              html = html.replace(/<\/body>/, `<script src="js/bundle.min.js?v=${buildVer}"></script>\n</body>`);
              fs.writeFileSync(indexPath, html, 'utf8');
              execSync(`html-minifier-terser --collapse-whitespace --remove-comments --remove-redundant-attributes --remove-script-type-attributes --remove-style-link-type-attributes --use-short-doctype --minify-css true --minify-js true -o "${indexPath}" "${indexPath}"`);
            }

            // 4. Update and minify sw.js
            const swPath = path.join(dir, 'sw.js');
            if (fs.existsSync(swPath)) {
              let sw = fs.readFileSync(swPath, 'utf8');
              sw = sw.replace(/const CACHE_NAME = '[^']*';/, `const CACHE_NAME = 'yt-player-cache-${buildVer}';`);
              sw = sw.replace(/'\.\/js\/(dom|utils|state|ui|mediaSession|lyrics|playback|main)\.js',?\s*/g, '');
              sw = sw.replace(/const CORE_ASSETS = \[\s*/, `const CORE_ASSETS = [\n    './js/bundle.min.js',\n`);
              fs.writeFileSync(swPath, sw, 'utf8');
              execSync(`terser --compress passes=3,pure_getters=true,unsafe=true --mangle --comments false -o "${swPath}" "${swPath}"`);
            }
          }

          buildDirectory('site-root');
          EOF

      - name: Post-Build Integrity Verification
        run: |
          echo "==> Verifying production bundle and Service Worker syntax..."
          if [ -f "site-root/js/bundle.min.js" ]; then
            node --check site-root/js/bundle.min.js
          fi
          if [ -f "site-root/sw.js" ]; then
            node --check site-root/sw.js
          fi
          echo "Production bundles verified successfully."

      - name: Upload Built Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-distribution
          path: site-root
          retention-days: 1

  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Built Distribution
        uses: actions/download-artifact@v4
        with:
          name: built-distribution
          path: site-root

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: production-edge
      url: ${{ steps.edge_distribution.outputs.deployment-url }}
    steps:
      - name: Download Built Distribution
        uses: actions/download-artifact@v4
        with:
          name: built-distribution
          path: site-root

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: false

      - name: Install Wrangler CLI
        run: npm install -g --prefer-offline wrangler@latest

      - name: Deploy Distribution to Cloudflare Pages
        id: edge_distribution
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.EDGE_SVC_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.EDGE_ORG_ID }}
          CI: "true"
          NO_COLOR: "1"
          NODE_NO_WARNINGS: "1"
        run: |
          PROJECT="${{ secrets.APP_TARGET_SLUG || secrets.CLOUDFLARE_PAGES_PROJECT || secrets.CF_PAGES_PROJECT || secrets.PAGES_PROJECT || secrets.PROJECT_NAME || 'music-player-web' }}"
          BRANCH="${{ github.ref_name }}"
          echo "Target project: ${PROJECT} (branch: ${BRANCH})"
          wrangler --version

          echo "--- Auth verification ---"
          wrangler whoami > /dev/null 2>&1 || true

          echo "--- Project validation & auto-creation ---"
          if ! wrangler pages project list 2>&1 | grep -q "${PROJECT}"; then
            echo "Project ${PROJECT} not found on account, creating with production-branch=main..."
            wrangler pages project create "${PROJECT}" --production-branch=main 2>&1 || true
          fi

          echo "--- Executing Pages deployment ---"
          set +e
          wrangler pages deploy site-root --project-name="${PROJECT}" --branch="${BRANCH}" --commit-dirty=true 2>&1 | tee deploy.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Wrangler deploy failed with exit code ${EXIT_CODE}"
            exit $EXIT_CODE
          fi

          DEPLOY_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | head -n 1)
          if [ -z "$DEPLOY_URL" ]; then
            if [ "$BRANCH" = "main" ]; then
              DEPLOY_URL="https://${PROJECT}.pages.dev"
            else
              DEPLOY_URL="https://${BRANCH}.${PROJECT}.pages.dev"
            fi
          fi
          echo "Deployment target URL: ${DEPLOY_URL}"
          echo "deployment-url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"

      - name: Wait 5s for Edge Network Propagation
        if: steps.edge_distribution.outputs.deployment-url != ''
        run: sleep 5

      - name: Audit Deployed Site with Lighthouse CI
        id: lighthouse
        if: steps.edge_distribution.outputs.deployment-url != ''
        uses: treosh/lighthouse-ci-action@v12
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
        with:
          urls: |
            ${{ steps.edge_distribution.outputs.deployment-url }}
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

      - name: Pin Lighthouse Report to GitHub Summary
        if: always()
        env:
          LH_LINKS: ${{ steps.lighthouse.outputs.links }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          REPORT_URL=""
          if [ -n "$LH_LINKS" ]; then
            REPORT_URL=$(echo "$LH_LINKS" | grep -o 'https://storage.googleapis.com/lighthouse-infrastructure.appspot.com/reports/[^"\'\'' ]*' | head -n 1)
          fi
          if [ -z "$REPORT_URL" ] && [ -d ".lighthouseci" ]; then
            REPORT_URL=$(grep -roh 'https://storage.googleapis.com/lighthouse-infrastructure.appspot.com/reports/[^"\'\'' ]*' .lighthouseci/ 2>/dev/null | head -n 1)
          fi
          export REPORT_URL

          node -e '
          const fs = require("fs");
          const path = require("path");

          try {
            const lhciDir = ".lighthouseci";
            const manifestPath = path.join(lhciDir, "manifest.json");
            const summaryFile = process.env.GITHUB_STEP_SUMMARY;
            const branch = process.env.BRANCH_NAME || "branch";
            const reportUrl = process.env.REPORT_URL || "";

            if (!fs.existsSync(manifestPath)) {
              if (summaryFile && reportUrl) {
                fs.appendFileSync(summaryFile, `## Lighthouse CI Audit Report (\`${branch}\`)\n\n**[Open Full Lighthouse Report](${reportUrl})**\n\n**Direct URL:** ${reportUrl}\n`);
              }
              process.exit(0);
            }

            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            const repRun = manifest.find(r => r.isRepresentativeRun) || manifest[0];
            if (!repRun || !repRun.jsonPath || !fs.existsSync(repRun.jsonPath)) {
              if (summaryFile && reportUrl) {
                fs.appendFileSync(summaryFile, `## Lighthouse CI Audit Report (\`${branch}\`)\n\n**[Open Full Lighthouse Report](${reportUrl})**\n\n**Direct URL:** ${reportUrl}\n`);
              }
              process.exit(0);
            }

            const lhr = JSON.parse(fs.readFileSync(repRun.jsonPath, "utf8"));
            const scoreBadge = (val) => {
              const s = Math.round((val || 0) * 100);
              const badge = s >= 90 ? "[PASS]" : s >= 50 ? "[WARN]" : "[FAIL]";
              return `${badge} **${s}**`;
            };

            const perf = scoreBadge(lhr.categories?.performance?.score);
            const a11y = scoreBadge(lhr.categories?.accessibility?.score);
            const bp = scoreBadge(lhr.categories?.["best-practices"]?.score);
            const seo = scoreBadge(lhr.categories?.seo?.score);

            const fcp = lhr.audits?.["first-contentful-paint"]?.displayValue || "N/A";
            const lcp = lhr.audits?.["largest-contentful-paint"]?.displayValue || "N/A";
            const tbt = lhr.audits?.["total-blocking-time"]?.displayValue || "N/A";
            const si = lhr.audits?.["speed-index"]?.displayValue || "N/A";
            const cls = lhr.audits?.["cumulative-layout-shift"]?.displayValue || "N/A";

            let md = `## Lighthouse CI Audit Report (\`${branch}\`)\n\n`;
            md += `### Category Scores\n`;
            md += `| Performance | Accessibility | Best Practices | SEO |\n`;
            md += `| :---: | :---: | :---: | :---: |\n`;
            md += `| ${perf} | ${a11y} | ${bp} | ${seo} |\n\n`;
            md += `### Core Web Vitals & Key Metrics\n`;
            md += `| Metric | Measurement |\n`;
            md += `|---|---|\n`;
            md += `| **First Contentful Paint (FCP)** | \`${fcp}\` |\n`;
            md += `| **Largest Contentful Paint (LCP)** | \`${lcp}\` |\n`;
            md += `| **Total Blocking Time (TBT)** | \`${tbt}\` |\n`;
            md += `| **Speed Index (SI)** | \`${si}\` |\n`;
            md += `| **Cumulative Layout Shift (CLS)** | \`${cls}\` |\n\n`;

            if (reportUrl) {
              md += `**[Click here to view the Full Interactive Lighthouse Report](${reportUrl})**\n\n`;
              md += `**Direct URL:** ${reportUrl}\n`;
            }

            if (summaryFile) {
              fs.appendFileSync(summaryFile, md, "utf8");
            }
          } catch (err) {
            console.error("Summary builder notice:", err);
          }
          '

      - name: Purge Edge Distribution Cache
        if: env.EDGE_ROUTE_TAG != '' && env.EDGE_SVC_KEY != ''
        env:
          EDGE_ROUTE_TAG: ${{ secrets.EDGE_ROUTE_TAG }}
          EDGE_SVC_KEY: ${{ secrets.EDGE_SVC_KEY }}
        run: |
          echo "Purging edge cache for route ${EDGE_ROUTE_TAG}..."
          RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${EDGE_ROUTE_TAG}/purge_cache" \
            -H "Authorization: Bearer ${EDGE_SVC_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          
          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "Edge cache successfully purged."
          else
            echo "Edge cache purge notice: ${RESPONSE}"
          fi
