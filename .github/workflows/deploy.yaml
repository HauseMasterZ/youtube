name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for 10 seconds to batch commits
        run: sleep 10

      - name: Checkout main (Root Site)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-root

      - name: Checkout dev (Dev Staging)
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-src
        continue-on-error: true

      - name: Merge Dev Subdirectory
        run: |
          if [ -d "dev-src" ]; then
            mkdir -p site-root/dev
            cp -rf dev-src/* site-root/dev/
            rm -rf site-root/dev/.git site-root/dev/.github
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject API Gateway URL
        env:
          GATEWAY_URL: ${{ secrets.API_GATEWAY_URL || vars.API_GATEWAY_URL }}
        run: |
          if [ -n "$GATEWAY_URL" ]; then
            if [ -f site-root/js/utils.js ]; then
              sed -i "s|__API_GATEWAY_URL__|$GATEWAY_URL|g" site-root/js/utils.js
            fi
            if [ -f site-root/dev/js/utils.js ]; then
              sed -i "s|__API_GATEWAY_URL__|$GATEWAY_URL|g" site-root/dev/js/utils.js
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
