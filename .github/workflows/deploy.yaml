name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'app.js'
      - 'app_remote.js'
      - 'style.css'
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - '*.png'
      - '*.svg'
      - 'fonts/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for 2 minutes to batch commits
        run: sleep 120
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
