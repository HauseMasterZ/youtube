name: Production Edge & GitHub Pages Deployment

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "deployments-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build & Minify Distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (Root Site)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-root

      - name: Copy Clean Root for Cloudflare
        if: github.ref == 'refs/heads/main'
        run: |
          cp -rf site-root cf-root
          rm -rf cf-root/.git cf-root/.github

      - name: Checkout dev (Dev Staging)
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-src
        continue-on-error: true

      - name: Merge Dev Subdirectory into GitHub Pages Root
        run: |
          if [ -d "dev-src" ]; then
            mkdir -p site-root/dev
            cp -rf dev-src/* site-root/dev/
            rm -rf site-root/dev/.git site-root/dev/.github
          fi
          rm -rf site-root/.git site-root/.github

      - name: Pre-Deployment Syntax & Integrity Guard
        run: |
          echo "==> Running syntax verification on source JavaScript files..."
          for f in site-root/js/*.js site-root/sw.js; do
            if [ -f "$f" ]; then
              node --check "$f"
            fi
          done
          if [ -d "site-root/dev" ]; then
            for f in site-root/dev/js/*.js site-root/dev/sw.js; do
              if [ -f "$f" ]; then
                node --check "$f"
              fi
            done
          fi
          if [ -d "cf-root" ]; then
            for f in cf-root/js/*.js cf-root/sw.js; do
              if [ -f "$f" ]; then
                node --check "$f"
              fi
            done
          fi
          echo "All source scripts passed syntax verification."

      - name: Inject API Gateway URL
        env:
          GATEWAY_URL: ${{ secrets.FEED_GATEWAY_URL || vars.FEED_GATEWAY_URL }}
        run: |
          TARGET_FILES="site-root/index.html site-root/js/utils.js"
          if [ -d "site-root/dev" ]; then
            TARGET_FILES="$TARGET_FILES site-root/dev/index.html site-root/dev/js/utils.js"
          fi
          if [ -d "cf-root" ]; then
            TARGET_FILES="$TARGET_FILES cf-root/index.html cf-root/js/utils.js"
          fi

          GATEWAY_URL="${GATEWAY_URL%/}"

          if [ -n "$GATEWAY_URL" ]; then
            for f in $TARGET_FILES; do
              if [ -f "$f" ]; then
                sed -i "s|__API_GATEWAY_URL__|$GATEWAY_URL|g" "$f"
              fi
            done
          else
            for f in site-root/index.html site-root/dev/index.html cf-root/index.html; do
              if [ -f "$f" ]; then
                sed -i '/__API_GATEWAY_URL__/d' "$f"
              fi
            done
          fi

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: false

      - name: Cache npm global tools
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-tools-v2
          restore-keys: |
            ${{ runner.os }}-npm-tools-

      - name: Install Build Tools
        run: npm install -g --prefer-offline html-minifier-terser terser clean-css-cli

      - name: Build, Bundle, and Minify Distributions
        env:
          BUILD_VER: ${{ github.sha }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          const buildVer = (process.env.BUILD_VER || Date.now().toString()).substring(0, 10);

          function buildDirectory(dir, branchPrefix) {
            if (!fs.existsSync(dir)) return;
            console.log(`==> Building, bundling, and minifying ${dir} (Build: ${buildVer}, Scope: ${branchPrefix})...`);

            // 1. Bundle 8 JS modules into single bundle.min.js
            const jsOrder = ['state.js', 'dom.js', 'utils.js', 'ui.js', 'mediaSession.js', 'lyrics.js', 'playback.js', 'main.js'];
            const jsDir = path.join(dir, 'js');
            let combinedJs = '';
            jsOrder.forEach(file => {
              const fPath = path.join(jsDir, file);
              if (fs.existsSync(fPath)) {
                combinedJs += '\n;\n' + fs.readFileSync(fPath, 'utf8');
              }
            });

            const bundlePath = path.join(jsDir, 'bundle.min.js');
            const tempBundle = path.join(jsDir, 'bundle.tmp.js');
            fs.writeFileSync(tempBundle, combinedJs, 'utf8');
            execSync(`terser --compress passes=3,pure_getters=true,unsafe=true --mangle --comments false -o "${bundlePath}" "${tempBundle}"`);
            if (fs.existsSync(tempBundle)) fs.unlinkSync(tempBundle);

            // 2. Minify CSS
            const cssPath = path.join(dir, 'css', 'style.css');
            let minifiedCss = '';
            if (fs.existsSync(cssPath)) {
              execSync(`cleancss -O2 -o "${cssPath}" "${cssPath}"`);
              minifiedCss = fs.readFileSync(cssPath, 'utf8');
            }

            // 3. Update, inline Critical CSS, and minify index.html
            const indexPath = path.join(dir, 'index.html');
            if (fs.existsSync(indexPath)) {
              let html = fs.readFileSync(indexPath, 'utf8');
              if (minifiedCss) {
                const inlinedCss = minifiedCss.replace(/url\((['"]?)\.\.\//g, 'url($1');
                html = html.replace(/<link\s+rel="stylesheet"\s+href="css\/style\.css(\?v=[^"]*)?">/i, `<style>${inlinedCss}</style>`);
              }
              html = html.replace(/<script\s+src="js\/(dom|utils|state|ui|mediaSession|lyrics|playback|main)\.js(\?v=[^"]*)?"><\/script>(\s*)/g, '');
              html = html.replace(/<\/body>/, `<script src="js/bundle.min.js?v=${buildVer}"></script>\n</body>`);
              fs.writeFileSync(indexPath, html, 'utf8');
              execSync(`html-minifier-terser --collapse-whitespace --remove-comments --remove-redundant-attributes --remove-script-type-attributes --remove-style-link-type-attributes --use-short-doctype --minify-css true --minify-js true -o "${indexPath}" "${indexPath}"`);
            }

            // 4. Update and minify sw.js with isolated cache name
            const swPath = path.join(dir, 'sw.js');
            if (fs.existsSync(swPath)) {
              let sw = fs.readFileSync(swPath, 'utf8');
              sw = sw.replace(/const CACHE_NAME = '[^']*';/, `const CACHE_NAME = 'yt-player-cache-${branchPrefix}-${buildVer}';`);
              sw = sw.replace(/'\.\/js\/(dom|utils|state|ui|mediaSession|lyrics|playback|main)\.js',?\s*/g, '');
              sw = sw.replace(/const CORE_ASSETS = \[\s*/, `const CORE_ASSETS = [\n    './js/bundle.min.js',\n`);
              fs.writeFileSync(swPath, sw, 'utf8');
              execSync(`terser --compress passes=3,pure_getters=true,unsafe=true --mangle --comments false -o "${swPath}" "${swPath}"`);
            }
          }

          // Build GitHub Pages root (main) and dev staging (dev)
          buildDirectory('site-root', 'main');
          if (fs.existsSync('site-root/dev')) {
            buildDirectory('site-root/dev', 'dev');
          }

          // Build Cloudflare Pages clean root (main)
          if (fs.existsSync('cf-root')) {
            buildDirectory('cf-root', 'main');
          }
          EOF

      - name: Post-Build Integrity Verification
        run: |
          echo "==> Verifying production bundle and Service Worker syntax..."
          for f in site-root/js/bundle.min.js site-root/sw.js; do
            if [ -f "$f" ]; then
              node --check "$f"
            fi
          done
          if [ -d "site-root/dev" ]; then
            for f in site-root/dev/js/bundle.min.js site-root/dev/sw.js; do
              if [ -f "$f" ]; then
                node --check "$f"
              fi
            done
          fi
          if [ -d "cf-root" ]; then
            for f in cf-root/js/bundle.min.js cf-root/sw.js; do
              if [ -f "$f" ]; then
                node --check "$f"
              fi
            done
          fi
          echo "Distributions verified successfully."

      - name: Upload GitHub Pages Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-distribution
          path: site-root
          retention-days: 1

      - name: Upload Cloudflare Distribution Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-distribution
          path: cf-root
          retention-days: 1

  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download GitHub Pages Distribution
        uses: actions/download-artifact@v4
        with:
          name: github-pages-distribution
          path: site-root

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Wait 15s for GitHub Pages CDN Propagation
        if: steps.deployment.outputs.page_url != ''
        run: sleep 15

      - name: Audit Deployed Site with Lighthouse CI
        id: lighthouse
        if: steps.deployment.outputs.page_url != ''
        uses: treosh/lighthouse-ci-action@v12
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
        with:
          urls: |
            ${{ steps.deployment.outputs.page_url }}
            ${{ format('{0}dev/', steps.deployment.outputs.page_url) }}
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages (Production Custom Domain)
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: production-edge
      url: ${{ steps.edge_distribution.outputs.deployment-url }}
    steps:
      - name: Download Cloudflare Distribution
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-distribution
          path: cf-root

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: false

      - name: Install Wrangler CLI
        run: npm install -g --prefer-offline wrangler@latest

      - name: Deploy Distribution to Cloudflare Pages
        id: edge_distribution
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.EDGE_SVC_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.EDGE_ORG_ID }}
          CI: "true"
          NO_COLOR: "1"
          NODE_NO_WARNINGS: "1"
        run: |
          PROJECT="${{ secrets.APP_TARGET_SLUG || secrets.CLOUDFLARE_PAGES_PROJECT || secrets.CF_PAGES_PROJECT || secrets.PAGES_PROJECT || secrets.PROJECT_NAME || 'music-player-web' }}"
          echo "Target project: ${PROJECT} (branch: main)"
          wrangler --version

          echo "--- Auth verification ---"
          wrangler whoami > /dev/null 2>&1 || true

          echo "--- Project validation & auto-creation ---"
          if ! wrangler pages project list 2>&1 | grep -q "${PROJECT}"; then
            echo "Project ${PROJECT} not found on account, creating with production-branch=main..."
            wrangler pages project create "${PROJECT}" --production-branch=main 2>&1 || true
          fi

          echo "--- Executing Pages deployment ---"
          set +e
          wrangler pages deploy cf-root --project-name="${PROJECT}" --branch="main" --commit-dirty=true 2>&1 | tee deploy.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Wrangler deploy failed with exit code ${EXIT_CODE}"
            exit $EXIT_CODE
          fi

          DEPLOY_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | head -n 1)
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="https://${PROJECT}.pages.dev"
          fi
          echo "Deployment target URL: ${DEPLOY_URL}"
          echo "deployment-url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"

      - name: Wait 5s for Edge Network Propagation
        if: steps.edge_distribution.outputs.deployment-url != ''
        run: sleep 5

      - name: Audit Deployed Site with Lighthouse CI
        id: lighthouse
        if: steps.edge_distribution.outputs.deployment-url != ''
        uses: treosh/lighthouse-ci-action@v12
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
        with:
          urls: |
            ${{ steps.edge_distribution.outputs.deployment-url }}
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true
