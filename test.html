<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swipe to Enqueue / Download (50px Fixed Gap)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .playlist-container {
      width: 100%;
      max-width: 480px;
    }

    .playlist-header {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #888888;
      margin-bottom: 16px;
    }

    /* Vertical collapse wrapper */
    .swipe-item-wrapper {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows 250ms cubic-bezier(0.4, 0, 0.2, 1),
                  margin-bottom 250ms cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 200ms ease;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .swipe-item-wrapper.collapsed {
      grid-template-rows: 0fr;
      margin-bottom: 0px;
      opacity: 0;
    }

    .swipe-item-inner {
      min-height: 0;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      user-select: none;
      touch-action: pan-y;
    }

    /* Underlay background */
    .swipe-underlay {
      position: absolute;
      inset: 0;
      background-color: #000000;
    }

    /* Action SVG containers: Absolute positioning for 50px gap tracking */
    .underlay-action {
      position: absolute;
      top: 50%;
      margin-top: -11px; /* Half of 22px height */
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      will-change: transform;
      color: #ffffff;
    }

    .underlay-action svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Initial parked state (hidden off-screen) */
    .action-enqueue {
      left: 0;
      transform: translateX(-22px); /* 0px gap + 22px icon width */
    }

    .action-download {
      right: 0;
      transform: translateX(22px); /* 0px gap + 22px icon width */
    }

    .underlay-action.snapping {
      transition: transform 250ms cubic-bezier(0.2, 0, 0, 1);
    }

    .underlay-action.legend-triggered {
      color: #00ff88;
    }

    .action-enqueue.enqueue-success {
      color: #00ff88 !important;
      filter: drop-shadow(0 0 6px rgba(0, 255, 136, 0.75));
    }

    .action-enqueue.enqueue-success::after {
      content: "";
      position: absolute;
      top: -2px;
      right: -3px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: #00ff88;
      box-shadow: 0 0 5px #00ff88, 0 0 8px rgba(0, 255, 136, 0.7);
      pointer-events: none;
    }

    /* Foreground surface (Draggable track row) */
    .swipe-surface {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: #1e1e1e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      cursor: grab;
      will-change: transform;
      transform: translateX(var(--swipe-x, 0px));
    }

    .swipe-surface:active {
      cursor: grabbing;
    }

    .swipe-surface.snapping {
      transition: transform 250ms cubic-bezier(0.2, 0, 0, 1);
    }

    .swipe-surface.exiting-right {
      transition: transform 200ms cubic-bezier(0.4, 0, 1, 1);
      transform: translateX(105%) !important;
    }

    .swipe-surface.exiting-left {
      transition: transform 200ms cubic-bezier(0.4, 0, 1, 1);
      transform: translateX(-105%) !important;
    }

    .track-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .track-title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }

    .track-artist {
      font-size: 12px;
      color: #999999;
    }

    .track-duration {
      font-size: 12px;
      color: #666666;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <div class="playlist-container">
    <div class="playlist-header">Swipe Right to Enqueue / Left to Download</div>

    <div class="swipe-item-wrapper" id="track-1">
      <div class="swipe-item-inner">
        <div class="swipe-underlay">
          <!-- Enqueue Icon (List with Plus) -->
          <div class="underlay-action action-enqueue">
            <svg viewBox="0 0 24 24">
              <line x1="4" y1="6" x2="14" y2="6"></line>
              <line x1="4" y1="12" x2="14" y2="12"></line>
              <line x1="4" y1="18" x2="11" y2="18"></line>
              <line x1="18" y1="9" x2="18" y2="15"></line>
              <line x1="15" y1="12" x2="21" y2="12"></line>
            </svg>
          </div>

          <!-- Download Icon (Arrow to Tray) -->
          <div class="underlay-action action-download">
            <svg viewBox="0 0 24 24">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </div>
        </div>

        <div class="swipe-surface">
          <div class="track-meta">
            <div class="track-title">Solar Drift</div>
            <div class="track-artist">Carbon Based Lifeforms</div>
          </div>
          <div class="track-duration">5:24</div>
        </div>
      </div>
    </div>

    <div class="swipe-item-wrapper" id="track-2">
      <div class="swipe-item-inner">
        <div class="swipe-underlay">
          <div class="underlay-action action-enqueue">
            <svg viewBox="0 0 24 24">
              <line x1="4" y1="6" x2="14" y2="6"></line>
              <line x1="4" y1="12" x2="14" y2="12"></line>
              <line x1="4" y1="18" x2="11" y2="18"></line>
              <line x1="18" y1="9" x2="18" y2="15"></line>
              <line x1="15" y1="12" x2="21" y2="12"></line>
            </svg>
          </div>

          <div class="underlay-action action-download">
            <svg viewBox="0 0 24 24">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </div>
        </div>

        <div class="swipe-surface">
          <div class="track-meta">
            <div class="track-title">Sublunary</div>
            <div class="track-artist">Solar Fields</div>
          </div>
          <div class="track-duration">4:12</div>
        </div>
      </div>
    </div>

    <div class="swipe-item-wrapper" id="track-3">
      <div class="swipe-item-inner">
        <div class="swipe-underlay">
          <div class="underlay-action action-enqueue">
            <svg viewBox="0 0 24 24">
              <line x1="4" y1="6" x2="14" y2="6"></line>
              <line x1="4" y1="12" x2="14" y2="12"></line>
              <line x1="4" y1="18" x2="11" y2="18"></line>
              <line x1="18" y1="9" x2="18" y2="15"></line>
              <line x1="15" y1="12" x2="21" y2="12"></line>
            </svg>
          </div>

          <div class="underlay-action action-download">
            <svg viewBox="0 0 24 24">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </div>
        </div>

        <div class="swipe-surface">
          <div class="track-meta">
            <div class="track-title">Resonance</div>
            <div class="track-artist">HOME</div>
          </div>
          <div class="track-duration">3:32</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function initGmailSwipe(wrapperElement) {
      const surface = wrapperElement.querySelector('.swipe-surface');
      const enqueueAction = wrapperElement.querySelector('.action-enqueue');
      const downloadAction = wrapperElement.querySelector('.action-download');

      let startX = 0;
      let currentX = 0;
      let isDragging = false;
      const thresholdRatio = 0.05; // 5% drag width confirms action
      const iconWidth = 22;
      const gap = 0;
      const parkOffset = gap + iconWidth; // 72px total offset

      surface.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        startX = e.clientX;
        isDragging = true;
        surface.classList.remove('snapping');
        enqueueAction.classList.remove('snapping');
        downloadAction.classList.remove('snapping');
        surface.setPointerCapture(e.pointerId);
      });

      surface.addEventListener('pointermove', (e) => {
        if (!isDragging) return;

        currentX = e.clientX - startX;
        surface.style.setProperty('--swipe-x', `${currentX}px`);

        if (currentX > 0) {
          // Right Swipe: Logo follows card div till fully revealed (0px), then clamps
          const enqX = Math.min(0, currentX - parkOffset);
          enqueueAction.style.transform = `translateX(${enqX}px)`;
          downloadAction.style.transform = `translateX(${parkOffset}px)`;
          if (currentX >= (surface.offsetWidth * thresholdRatio)) {
            enqueueAction.classList.add('legend-triggered');
          } else {
            enqueueAction.classList.remove('legend-triggered', 'enqueue-success');
          }
        } else if (currentX < 0) {
          // Left Swipe: Logo follows card div till fully revealed (0px), then clamps
          const downX = Math.max(0, currentX + parkOffset);
          downloadAction.style.transform = `translateX(${downX}px)`;
          enqueueAction.style.transform = `translateX(-${parkOffset}px)`;
          enqueueAction.classList.remove('legend-triggered', 'enqueue-success');
        } else {
          enqueueAction.style.transform = `translateX(-${parkOffset}px)`;
          downloadAction.style.transform = `translateX(${parkOffset}px)`;
          enqueueAction.classList.remove('legend-triggered', 'enqueue-success');
        }
      });

      function finishSwipe(e) {
        if (!isDragging) return;
        isDragging = false;
        surface.releasePointerCapture(e.pointerId);

        const thresholdPx = surface.offsetWidth * thresholdRatio;
        const pastThreshold = Math.abs(currentX) > thresholdPx;

        if (pastThreshold) {
          // Eject surface off-screen
          const isRight = currentX > 0;
          if (isRight) {
            enqueueAction.classList.add('enqueue-success');
          }
          surface.classList.add(isRight ? 'exiting-right' : 'exiting-left');

          surface.addEventListener('transitionend', (ev) => {
            if (ev.propertyName !== 'transform') return;

            // Collapse height to close list gap
            wrapperElement.classList.add('collapsed');

            wrapperElement.addEventListener('transitionend', (collapseEv) => {
              if (collapseEv.propertyName !== 'grid-template-rows') return;
              wrapperElement.remove();
            }, { once: true });

          }, { once: true });

        } else {
          // Aborted: Snap surface and SVGs back to parked state
          surface.classList.add('snapping');
          enqueueAction.classList.add('snapping');
          downloadAction.classList.add('snapping');

          surface.style.setProperty('--swipe-x', '0px');
          enqueueAction.style.transform = `translateX(-${parkOffset}px)`;
          downloadAction.style.transform = `translateX(${parkOffset}px)`;
        }

        currentX = 0;
      }

      surface.addEventListener('pointerup', finishSwipe);
      surface.addEventListener('pointercancel', finishSwipe);
    }

    document.querySelectorAll('.swipe-item-wrapper').forEach(initGmailSwipe);
  </script>
</body>
</html>
